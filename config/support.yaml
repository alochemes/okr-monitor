model: claude-sonnet-4-6
max_tokens: 1536
temperature: 0.3
cadence: per_ticket_batch
output_kinds:
  - ticket_triage
output_quality_bar:
  - Each ticket categorized — bug, question, feature_request, integration_issue, churn_signal.
  - Severity assigned — p0/p1/p2/p3.
  - Draft response written for category 'question' tickets; bug tickets get a repro template.
